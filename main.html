<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>청기백기 리듬게임</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- START SCREEN -->
  <div class="overlay" id="startScreen">
    <div class="ov-title">청기백기</div>
    <div class="ov-note">
      👁 <b>보기</b> — 8개 명령이 순서대로 공개됩니다<br>
      ✋ <b>입력</b> — 같은 간격으로 타이밍에 맞게 누르세요<br><br>
      ▲ 뛰어&nbsp;&nbsp;·&nbsp;&nbsp;▼ 엎드려&nbsp;&nbsp;·&nbsp;&nbsp;<b>Space</b> 안 누름
    </div>
    <div class="ov-actions">
      <button class="btn btn-start" onclick="Game.handleStart(false)">▶ START</button>
      <button class="btn btn-start" onclick="Game.handleStart(true)">▶ REVERSE</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="overlay hidden" id="resultScreen">
    <div class="ov-title" id="resTitle">결과</div>
    <div class="ov-score" id="resScore">0</div>
    <div class="ov-detail" id="resDetail"></div>
    <div class="ov-actions">
      <button class="btn btn-start" onclick="Game.restart(false)">↺ 다시하기</button>
      <button class="btn" onclick="Game.goTitle()">◀ 타이틀</button>
    </div>
  </div>

  <div class="overlay hidden" id="loadingScreen">
    <div class="ov-title">로딩 중...</div>
  </div>

  <div id="app">
    <div class="round-announce" id="roundAnnounce"></div>
    <!-- ── 왼쪽: 캐릭터 + HUD + 버튼 ── -->
    <div class="left-col">
      <button class="btn btn-up" id="btnUp" onclick="InputHandler.press('UP')">
        ▲ 뛰어
        <span class="btn-key">↑ / W</span>
      </button>

    </div>
    <!-- ── 중앙: 페이즈 + 슬롯 + 라운드 ── -->
    <div class="center-col">
      <div class="top-bar">
        <div class="logo">청기백기</div>
        <div class="phase-bar">
          <div class="phase-half" id="phaseShow">👁 보기</div>
          <div class="phase-half" id="phaseInput">✋ 입력</div>
        </div>
        <div class="round-info">
          <span class="round-label">ROUND</span>
          <span class="round-val" id="roundEl">- / -</span>
        </div>
      </div>

      <div class="slots" id="slotsEl"></div>

      <div class="pip-row" id="pipRow"></div>
      <div class="hud">
        <div class="hud-item">
          <div class="hud-label">SCORE</div>
          <div class="hud-val" id="scoreEl">0</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">LIFE</div>
          <div class="hud-val" id="lifeEl">❤❤❤❤❤</div>
        </div>
        <div class="hud-item">
          <div class="hud-label">COMBO</div>
          <div class="hud-val" id="comboEl">0</div>
        </div>
      </div>

      <div class="char-area">
        <img id="char" src="./img/graffe_standing.png" alt="character" />
        <div class="judgment" id="judgment"></div>
      </div>

      <div class="controls">

      </div>


    </div>
    <div class="right-col">
      <button class="btn btn-down" id="btnDown" onclick="InputHandler.press('DOWN')">
        ▼ 엎드려
        <span class="btn-key">↓ / S</span>
    </div>

  </div>

  <script src="script.js"></script>
</body>
<audio id="frogSfx" src="./frogSound.mp3" preload="false"></audio>
<div class="frog-flash" id="frogFlash"></div>

</html>
